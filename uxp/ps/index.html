<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="header">
    <div id="title">Photoshop MCP Agent</div>
    <div id="attribution">
      <span>by <a href="https://github.com/antonsynd/adb-mcp">Anton Nguyen</a></span>
      <span class="separator">&middot;</span>
      <span>originally by <a href="https://github.com/mikechambers/adb-mcp">Mike Chambers</a></span>
    </div>
  </div>

  <div id="connection">
    <div id="status-row">
      <span id="statusIndicator" class="status-dot disconnected"></span>
      <span id="statusText">Disconnected</span>
    </div>
    <sp-button id="btnStart">Connect</sp-button>
  </div>

  <div id="options">
    <sp-checkbox id="chkConnectOnLaunch">Connect on Launch</sp-checkbox>
  </div>

  <script src="main.js"></script>
</body>

</html>
